<!-- Floating Action Button -->
<button 
  class="fixed bottom-6 right-6 p-4 rounded-full bg-indigo-600 text-white shadow-lg hover:bg-indigo-500 hover:shadow-indigo-500/25 transition-all duration-300 z-50 flex items-center justify-center animate-pulseGlow"
  (click)="toggleChat()">
  <span class="material-icons">{{ isOpen ? 'close' : 'smart_toy' }}</span>
</button>

<!-- Chat Window -->
<div 
  class="glass-panel fixed bottom-24 right-6 w-96 max-w-[90vw] h-[500px] max-h-[80vh] flex flex-col z-40 transition-all duration-300 transform origin-bottom-right"
  [ngClass]="{'scale-100 opacity-100 visible': isOpen, 'scale-90 opacity-0 invisible': !isOpen}">
  
  <!-- Header -->
  <div class="p-4 border-b border-indigo-500/20 flex items-center gap-3">
    <span class="material-icons text-indigo-400">psychology</span>
    <h3 class="font-semibold text-white">ArchForge AI</h3>
  </div>

  <!-- Messages Area -->
  <div #scrollContainer class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngFor="let msg of messages" class="flex" [ngClass]="{'justify-end': msg.role === 'user', 'justify-start': msg.role === 'ai'}">
      <div 
        class="max-w-[85%] rounded-2xl p-3 text-sm"
        [ngClass]="{
          'bg-indigo-600/80 text-white rounded-br-sm': msg.role === 'user',
          'bg-obsidian border border-indigo-500/30 text-gray-300 rounded-bl-sm': msg.role === 'ai'
        }">
        {{ msg.content }}
      </div>
    </div>
    
    <!-- Skeleton Loader when loading -->
    <div *ngIf="isLoading" class="flex justify-start">
      <div class="skeleton bg-obsidian border border-indigo-500/30 rounded-2xl rounded-bl-sm p-4 max-w-[85%] space-y-2">
        <div class="h-2 bg-indigo-500/20 rounded w-24"></div>
        <div class="h-2 bg-indigo-500/20 rounded w-32"></div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="p-4 border-t border-indigo-500/20 bg-obsidian/50 rounded-b-2xl">
    <div class="relative flex items-center">
      <textarea 
        class="w-full bg-midnight/50 text-white rounded-xl py-3 pl-4 pr-12 border border-indigo-500/30 focus:border-indigo-400 focus:outline-none focus:ring-1 focus:ring-indigo-400 resize-none"
        rows="1"
        placeholder="Ask about the architecture..."
        [(ngModel)]="userInput"
        (keydown)="handleKeyDown($event)"
        [disabled]="!projectId || isLoading"
      ></textarea>
      <button 
        class="absolute right-2 p-2 text-indigo-400 hover:text-indigo-300 disabled:opacity-50 transition-colors"
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || !projectId || isLoading">
        <span class="material-icons">send</span>
      </button>
    </div>
  </div>
</div>
