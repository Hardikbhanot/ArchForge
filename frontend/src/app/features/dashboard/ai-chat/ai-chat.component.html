<!-- Floating Action Button -->
<button class="chat-fab" (click)="toggleChat()">
  <span class="material-icons">{{ isOpen ? 'close' : 'smart_toy' }}</span>
</button>

<!-- Chat Window -->
<div class="chat-window" [ngClass]="{'open': isOpen}">
  
  <!-- Header -->
  <div class="chat-header">
    <span class="material-icons">psychology</span>
    <h3>ArchForge AI</h3>
  </div>

  <!-- Messages Area -->
  <div #scrollContainer class="chat-messages">
    <div *ngFor="let msg of messages" class="message-row" [ngClass]="msg.role">
      <div class="message-bubble">
        {{ msg.content }}
      </div>
    </div>
    
    <!-- Skeleton Loader when loading -->
    <div *ngIf="isLoading" class="message-row ai">
      <div class="message-bubble skeleton-loader">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <div class="input-container">
      <textarea 
        class="chat-input"
        rows="1"
        [placeholder]="projectId ? 'Ask about the architecture...' : 'Select a project first...'"
        [(ngModel)]="userInput"
        (keydown)="handleKeyDown($event)"
        [disabled]="!projectId || isLoading"
      ></textarea>
      <button 
        class="send-button"
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || !projectId || isLoading">
        <span class="material-icons">send</span>
      </button>
    </div>
  </div>
</div>
